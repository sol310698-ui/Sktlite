name: Scaffold Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: android/ios/pubspec.yaml oluştur (lib/ dokunulmaz)
        run: |
          mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          flutter create --org com.demir --project-name skt_takip_lite .
          cd "$GITHUB_WORKSPACE"
          rm -rf android ios
          cp -r /tmp/scaffold/android .
          cp -r /tmp/scaffold/ios .
          if [ ! -f pubspec.yaml ]; then
            cp /tmp/scaffold/pubspec.yaml .
          fi
          # Kamera izni otomatik eklensin
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Bağımlılıkları pubspec.yaml'a ekle
        run: |
          if ! grep -q "flutter_riverpod" pubspec.yaml; then
            sed -i '/^dependencies:/a\
  flutter_riverpod: ^2.5.1\
  sqflite: ^2.3.3\
  path: ^1.9.0\
  mobile_scanner: ^5.2.3\
  intl: ^0.19.0' pubspec.yaml
          fi

      - name: Commit ve push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android ios pubspec.yaml
          git commit -m "Flutter proje iskeleti eklendi (otomatik)" || echo "İskelet zaten var, değişiklik yok"
          git push
